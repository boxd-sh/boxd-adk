name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install '.[dev]' build
      - name: Lint
        run: |
          ruff check boxd_adk tests examples
          ruff format --check boxd_adk tests examples
      - name: Unit tests
        run: pytest -q
      - name: Build
        run: python -m build
